# Render.com deployment config (Infrastructure as Code).
# With this file in the repo, Render can deploy the app automatically.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: qa-crawler
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Render sets $PORT automatically; the server reads it. Do NOT hardcode PORT.
    envVars:
      # Basic Auth gate so only people with the password can use the public app.
      # Set these privately in the Render dashboard (Environment tab) — they are
      # NOT stored in this public repo for security. Suggested: manojkumar / your password.
      - key: AUTH_USER
        sync: false
      - key: AUTH_PASS
        sync: false
      # Optional: set an OpenAI key here to enable AI summaries for everyone.
      # - key: OPENAI_API_KEY
      #   sync: false
    healthCheckPath: /
    autoDeploy: true
